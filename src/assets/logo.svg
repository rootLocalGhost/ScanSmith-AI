<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Shadow -->
    <filter id="neo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="28" dy="28" stdDeviation="0" flood-color="#18181b" flood-opacity="1" />
    </filter>
    <filter id="spark-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#18181b" flood-opacity="1" />
    </filter>
    <!-- Gradients -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a3e635" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Neo-Brutalist Main App Background Tile -->
  <rect x="72" y="72" width="840" height="840" rx="190" fill="#18181b" />
  <rect x="64" y="64" width="840" height="840" rx="180" fill="#27272a" stroke="#18181b" stroke-width="32" />
  
  <!-- Subtle Grid Pattern in background -->
  <path d="M 64 344 H 904 M 64 624 H 904 M 344 64 V 904 M 624 64 V 904" stroke="#3f3f46" stroke-width="6" stroke-dasharray="16 16" opacity="0.4" />

  <!-- Document Sheet (with hard offset shadow) -->
  <!-- Document Shadow -->
  <path d="M 280 200 L 620 200 L 760 340 L 760 810 L 280 810 Z" fill="#18181b" transform="translate(24, 24)" />
  
  <!-- Document Body -->
  <path d="M 280 200 L 620 200 L 760 340 L 760 810 L 280 810 Z" fill="url(#docGrad)" stroke="#18181b" stroke-width="30" stroke-linejoin="round" />
  
  <!-- Document Corner Fold -->
  <path d="M 620 200 L 620 340 L 760 340 Z" fill="url(#foldGrad)" stroke="#18181b" stroke-width="28" stroke-linejoin="round" />

  <!-- Document Text Lines -->
  <!-- Header title line -->
  <rect x="360" y="380" width="220" height="34" rx="10" fill="#18181b" />
  
  <!-- Paragraph lines -->
  <rect x="360" y="460" width="320" height="24" rx="8" fill="#a1a1aa" />
  <rect x="360" y="520" width="280" height="24" rx="8" fill="#a1a1aa" />
  <rect x="360" y="580" width="310" height="24" rx="8" fill="#a1a1aa" />
  <rect x="360" y="640" width="230" height="24" rx="8" fill="#a1a1aa" />

  <!-- Horizontal Laser / Scanner Beam Flare -->
  <g>
    <!-- Glow beam -->
    <rect x="220" y="488" width="580" height="36" rx="18" fill="url(#beamGrad)" />
    <!-- Center laser line -->
    <line x1="200" y1="506" x2="820" y2="506" stroke="#a3e635" stroke-width="14" stroke-linecap="round" />
    <circle cx="210" cy="506" r="16" fill="#a3e635" stroke="#18181b" stroke-width="8" />
    <circle cx="810" cy="506" r="16" fill="#38bdf8" stroke="#18181b" stroke-width="8" />
  </g>

  <!-- Neo-Brutalist AI Sparkle Star (Top-Right / Badge) -->
  <g transform="translate(670, 150)">
    <!-- Star Shadow -->
    <path d="M 90 0 C 90 50 130 90 180 90 C 130 90 90 130 90 180 C 90 130 50 90 0 90 C 50 90 90 50 90 0 Z" fill="#18181b" transform="translate(14, 14)" />
    <!-- Star Body -->
    <path d="M 90 0 C 90 50 130 90 180 90 C 130 90 90 130 90 180 C 90 130 50 90 0 90 C 50 90 90 50 90 0 Z" fill="#a3e635" stroke="#18181b" stroke-width="16" stroke-linejoin="round" />
    <!-- Core Spark -->
    <circle cx="90" cy="90" r="14" fill="#ffffff" />
  </g>

  <!-- Secondary AI Sparkle (Bottom-Left) -->
  <g transform="translate(180, 680) scale(0.65)">
    <!-- Star Shadow -->
    <path d="M 90 0 C 90 50 130 90 180 90 C 130 90 90 130 90 180 C 90 130 50 90 0 90 C 50 90 90 50 90 0 Z" fill="#18181b" transform="translate(14, 14)" />
    <!-- Star Body -->
    <path d="M 90 0 C 90 50 130 90 180 90 C 130 90 90 130 90 180 C 90 130 50 90 0 90 C 50 90 90 50 90 0 Z" fill="#8b5cf6" stroke="#18181b" stroke-width="16" stroke-linejoin="round" />
    <!-- Core Spark -->
    <circle cx="90" cy="90" r="14" fill="#ffffff" />
  </g>
</svg>
